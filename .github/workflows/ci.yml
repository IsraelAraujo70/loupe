name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    # Linux only, and only the crates that do not depend on GPUI. The Release
    # workflow lints `loupe-app` and builds it on Linux and macOS.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # With no argument, rustup 1.28+ installs the toolchain and components
      # named in rust-toolchain.toml (`rustup show` no longer installs).
      - name: Install toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Format
        run: cargo fmt --all --check
      - name: App icon
        run: python3 scripts/make-icon.py --check
      - name: Logo
        run: python3 scripts/make-logo.py --check
      - name: Website hero frame
        run: node site/hero-frame.js --check
      - name: Website
        run: python3 site/build.py
      - name: Clippy
        run: cargo clippy -p loupe-github -p loupe-linear -p loupe-t3 -p loupe-update --all-targets -- -D warnings
      - name: Test
        run: cargo test -p loupe-github -p loupe-linear -p loupe-t3 -p loupe-update
