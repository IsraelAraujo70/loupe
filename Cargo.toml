[workspace]
resolver = "2"
members = ["crates/*"]
default-members = ["crates/loupe-app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"

[workspace.dependencies]
loupe-github = { path = "crates/loupe-github" }
loupe-linear = { path = "crates/loupe-linear" }
loupe-t3 = { path = "crates/loupe-t3" }
# Tree-sitter grammars for the languages Loupe's diffs, review threads and
# markdown code blocks highlight (docs: github/highlight.rs). They compile C.
gpui-kit = { version = "=0.9.0", features = [
    "tree-sitter",
    "tree-sitter-typescript",
    "tree-sitter-tsx",
    "tree-sitter-javascript",
    "tree-sitter-rust",
    "tree-sitter-yaml",
    "tree-sitter-toml",
    "tree-sitter-markdown",
    "tree-sitter-markdown-inline",
    "tree-sitter-css",
    "tree-sitter-html",
    "tree-sitter-bash",
    "tree-sitter-go",
    "tree-sitter-python",
    "tree-sitter-sql",
    "tree-sitter-graphql",
] }
ureq = { version = "3", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
anyhow = "1"
apollo-compiler = "1"
futures = "0.3"
security-framework = "3"
# The T3 server starts threads only over its WebSocket RPC (loupe-t3).
tungstenite = { version = "0.30", default-features = false, features = [
    "handshake",
    "rustls-tls-native-roots",
] }

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 1

# gpui-kit embeds its icons with rust-embed, which in a debug build reads them
# from the disk of the machine that compiled it. With debug assertions off for
# these two crates the icons are embedded, so a debug binary built in a
# sandbox draws them on another machine.
[profile.dev.package.gpui-kit-assets]
debug-assertions = false

[profile.dev.package.rust-embed]
debug-assertions = false

[profile.release]
lto = "thin"
codegen-units = 16
strip = "debuginfo"
